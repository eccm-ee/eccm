<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 354" width="354" height="354" color="#1a1a1a" role="img" aria-labelledby="t d">
  <title id="t">ECCM</title>
  <desc id="d">The ECCM mark in a square, ink on white, no tagline, no hairlines, the M 12 units wider than the drawn one with its V arms a stem wide, for 48 and 64 px where the drawn M is a blob. Same square as logo-square.svg, the letters centred.</desc>
  <!-- the square: 354 on a side. The letters, E's left edge to M's right
       edge, 298 wide and 93 tall in logo.svg's units, are the block that is
       aligned: a margin of two stems (28) each side, and the E's middle bar
       on the square's centre line, which puts the block 2 units above the
       geometric centre. The five stave hairlines are ornament at their own
       12 units, as in the logo, hanging into the right margin (asked
       2026-09-27: "stave examples: should be narrow as in original logo, do
       not extend or adjust eccm size") -->
  <rect width="354" height="354" fill="#ffffff"/>
  <g fill="currentColor">
    <!-- the letters are the fixed mark; the lines are a layer that comes and
         goes, is extended or animated -->
    <g transform="translate(-13 103.5)">
      <g class="letters"><rect x="35" y="29" width="14" height="93"/><rect x="35" y="29" width="38" height="13"/><rect x="35" y="67" width="31" height="13"/><rect x="35" y="108" width="38" height="14"/><path d="M146 60 V49 A15 15 0 0 0 116 49 V101.5 A15 15 0 0 0 146 101.5 V88" fill="none" stroke="currentColor" stroke-width="14"/><path d="M227 60 V49 A15 15 0 0 0 197 49 V101.5 A15 15 0 0 0 227 101.5 V88" fill="none" stroke="currentColor" stroke-width="14"/><rect x="273" y="29" width="14" height="93"/><rect x="331" y="29" width="14" height="93"/><polygon points="281,29 295,29 309,84 323,29 337,29 316,122 302,122"/></g>
    </g>
  </g>
</svg>
