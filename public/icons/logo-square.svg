<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 354 354" width="354" height="354" color="#1a1a1a" role="img" aria-labelledby="t d">
  <title id="t">ECCM</title>
  <desc id="d">The ECCM mark in a square, ink on white, no tagline. The mark is logo.svg's, measured off the JPEG eccm.ee serves; the stave runs to the edge.</desc>
  <!-- the square: 354 on a side. The letters, E's left edge to M's right
       edge, 298 wide and 93 tall in logo.svg's units, are the block that is
       aligned: a margin of two stems (28) each side, and the E's middle bar
       on the square's centre line, which puts the block 2 units above the
       geometric centre, the mark's own middle rather than its box's. The five
       stave hairlines are ornament and run from the M to the square's right
       edge (asked 2026-09-27: "consider ECCM as a block to align and 5 lines
       just extend from M to right edge") -->
