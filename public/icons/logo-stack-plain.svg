<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 270" width="270" height="270" color="#1a1a1a" role="img" aria-labelledby="t d">
  <title id="t">ECCM</title>
  <desc id="d">The stacked ECCM mark, ink on white, no hairlines and the wider M, for 48 and 64 px.</desc>
  <!-- the square: 270 on a side. Two rows of the letters of logo.svg in its
       units. The block is 143 wide, the second row's C to M, centred with
       57.5 each side; the first row spreads to the block's edges, the E on
       the left over the C and the C on the right over the M, with the join
       between them drawn across the gap (asked 2026-09-27: "align E to left
       and C to right"); two stems between the rows, two stems above and
       below; the stave at its own 12 units past the M -->
  <rect width="270" height="270" fill="#ffffff"/>
  <g fill="currentColor">
    <!-- the letters are the fixed mark; the lines are a layer that comes and
         goes, is extended or animated -->
    <g transform="translate(0 -1)">
      <g class="letters"><g transform="translate(22.5 0)"><rect x="35" y="29" width="14" height="93"/><rect x="35" y="29" width="38" height="13"/><rect x="35" y="67" width="31" height="13"/><rect x="35" y="108" width="38" height="14"/></g><g transform="translate(59.5 0)"><path d="M146 60 V49 A15 15 0 0 0 116 49 V101.5 A15 15 0 0 0 146 101.5 V88" fill="none" stroke="currentColor" stroke-width="14"/></g></g>
    </g>
    <g transform="translate(-132.5 120)">
      <g class="letters"><path d="M227 60 V49 A15 15 0 0 0 197 49 V101.5 A15 15 0 0 0 227 101.5 V88" fill="none" stroke="currentColor" stroke-width="14"/><rect x="273" y="29" width="14" height="93"/><rect x="331" y="29" width="14" height="93"/><polygon points="281,29 295,29 309,84 323,29 337,29 316,122 302,122"/></g>
    </g>
  </g>
</svg>
