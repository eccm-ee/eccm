<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">
  <!-- public/vendor/icons/feather/sprite.svg, written 2026-10-02 for /icons: the shapes of play.svg, pause.svg and stop.svg beside it, unchanged except: their stroke width, caps and joins taken off so the page sets them, and vector-effect non-scaling-stroke on each so a stroke width of 1 is one CSS pixel at every size; and the stop square's rx="2" dropped, since the site has no radius; and shape-rendering crispEdges on the rectangles, so a 1 px edge that lands between two pixels on a 1x screen is drawn in one pixel and not as two half-grey ones (MEASURED on /icons at 1280, 2026-10-02: the stop square grey and 2 px wide at 16, 24 and 32 without it). Licence: LICENSE beside it. -->
  <symbol id="play" viewBox="0 0 24 24"><polygon vector-effect="non-scaling-stroke" points="5 3 19 12 5 21 5 3"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><rect shape-rendering="crispEdges" vector-effect="non-scaling-stroke" x="6" y="4" width="4" height="16"/><rect shape-rendering="crispEdges" vector-effect="non-scaling-stroke" x="14" y="4" width="4" height="16"/></symbol>
  <symbol id="stop" viewBox="0 0 24 24"><rect shape-rendering="crispEdges" vector-effect="non-scaling-stroke" x="3" y="3" width="18" height="18"/></symbol>
  <symbol id="volume" viewBox="0 0 24 24"><polygon vector-effect="non-scaling-stroke" points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path vector-effect="non-scaling-stroke" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
</svg>
